[package]
name = "gromacs"
kind = "tool"
version = "2026.4"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/gromacs"

[command]
name = "taf-gromacs"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/gromacs:2026.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["molecular-dynamics", "molecular-simulation", "structural-biology", "computational-chemistry"]
keywords = ["gromacs", "gmx", "molecular-dynamics", "simulation", "mdrun", "grompp", "pdb2gmx", "trajectory-analysis"]
description = "CPU-only GROMACS molecular dynamics simulation and analysis suite, including the gmx command-line tool, built-in force-field data, preparation commands, mdrun, and analysis subcommands."

[upstream]
name = "GROMACS"
type = "gitlab"
repo = "gromacs/gromacs"
homepage = "https://www.gromacs.org/"
release_url = "https://manual.gromacs.org/2026.4/release-notes/2026/2026.4.html"
downloads = "https://ftp.gromacs.org/gromacs/gromacs-2026.4.tar.gz"
version = "2026.4"
license = "LGPL-2.1-or-later"
citation = "GROMACS development team 2026; Abraham et al. 2015"
doi = "10.5281/zenodo.23102386; 10.1016/j.softx.2015.06.001"
watch = "manual"

[smoke]
backend = "docker"
timeout = 180
exist = ["gmx", "gromacs-smoke"]
test = ["gromacs-smoke version", "gromacs-smoke help", "gromacs-smoke convert", "gromacs-smoke prepare", "gromacs-smoke simulate", "gromacs-smoke resources", "gromacs-smoke conditional", "gromacs-smoke negative"]
